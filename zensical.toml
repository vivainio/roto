[project]

site_name = "The roto book"
site_description = "Run and develop roto, the persistent AWS simulator written in Rust."
site_author = "Ville Vainio"
site_url = "https://vivainio.github.io/roto/"
docs_dir = "docs"

copyright = """
Copyright &copy; 2026 Ville Vainio
"""

repo_url = "https://github.com/vivainio/roto"
repo_name = "vivainio/roto"
edit_uri = "edit/main/docs/"

nav = [
  { "Introduction" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Lua setup" = "lua.md" },
  { "Runtime hooks (planned)" = "runtime-hooks.md" },
  { "Integration testing" = "integration-testing.md" },
  { "Server reference" = "server.md" },
  { "Services" = [
    { "Coverage overview" = "services.md" },
    { "KMS" = "kms.md" },
    { "Local Lambda execution" = "lambda.md" },
    { "EventBridge" = "eventbridge.md" },
    { "CloudFormation" = "cloudformation.md" },
    { "Kinesis" = "kinesis.md" },
  ] },
  { "Storage" = "storage.md" },
  { "Architecture" = "architecture.md" },
  { "Development" = "development.md" },
  { "Documentation" = "documentation.md" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/notebook-tabs"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/vivainio"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
