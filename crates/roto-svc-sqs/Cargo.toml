[package]
name = "roto-svc-sqs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
diesel = { version = "2.3.14", default-features = false, features = ["sqlite", "32-column-tables", "returning_clauses_for_sqlite_3_35"] }
hex = "0.4.3"
md-5 = "0.11.0"
roto-core = { version = "0.0.1", path = "../roto-core" }
roto-protocol = { version = "0.0.1", path = "../roto-protocol" }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
uuid = { version = "1.27.0", features = ["v4"] }
