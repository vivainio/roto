name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: Existing release run whose distributions should be published
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-wheels:
    if: github.event_name != 'workflow_dispatch'
    uses: vivainio/actions/.github/workflows/maturin-wheels.yml@02bae930945fc58b2baf78774e8ae14f5d92f13d
    with:
      linux-arm64: true
      sdist: true
      maturin-version: v1.15.0

  lua-service-bundle:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m unittest discover -s tests -p test_package_lua_services.py
      - name: Package optional Lua services
        run: python3 scripts/package-lua-services.py --output "dist/roto-lua-services-${GITHUB_REF_NAME}.zip"
      - name: Attach bundle to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Optional Lua service bundle for Roto."
          fi
          gh release upload "$GITHUB_REF_NAME" "dist/roto-lua-services-${GITHUB_REF_NAME}.zip" --clobber

  publish-pypi:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.build-wheels.result == 'success') }}
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: vivainio/actions/publish-pypi-artifacts@51443b0c31ab8be7e8f3fc5787bf473a177cc935
        with:
          run-id: ${{ inputs.artifact-run-id || github.run_id }}
