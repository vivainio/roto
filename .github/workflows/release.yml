name: Release to PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-wheels:
    uses: vivainio/actions/.github/workflows/maturin-wheels.yml@02bae930945fc58b2baf78774e8ae14f5d92f13d
    with:
      linux-arm64: true
      sdist: true
      maturin-version: v1.15.0

  publish-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: vivainio/actions/publish-pypi-artifacts@02bae930945fc58b2baf78774e8ae14f5d92f13d
