name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: S3 browser integration tests
        run: |
          cargo build -p roto-server --locked
          python3 tests/smoke-s3-browser.py
      - name: Generated code is up to date
        run: scripts/gen.sh && git diff --exit-code
  mqtt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.3" }
      - run: cargo build -p roto-server --locked
      - run: bun install --frozen-lockfile
        working-directory: tests/mqtt
      - name: MQTT.js WebSocket integration and Lua policy checks
        run: bun test
        working-directory: tests/mqtt
  lua-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [cur, acm, budgets, config, servicediscovery, opensearch, rds, ecr, ecs, glue]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cargo build -p roto-server --locked
      - run: python3 -m unittest discover -s tests -p test_package_lua_services.py
      - run: python3 -m pip install boto3==1.42.97
      - name: Service HTTP and SDK contracts (directory and ZIP bundle)
        run: python3 tests/smoke-lua-services.py --service ${{ matrix.service }} --sdk
  moto-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache the pinned CloudFormation resource spec
        uses: actions/cache@v4
        with:
          path: ~/.cache/roto
          key: cfn-spec-${{ hashFiles('crates/roto-svc-cloudformation/src/spec.rs') }}
      - name: moto's own test suite against roto (server mode)
        run: |
          scripts/run-moto-tests.sh test_sts
          scripts/run-moto-tests.sh test_sqs
          scripts/run-moto-tests.sh test_s3
          scripts/run-moto-tests.sh test_iam
          scripts/run-moto-tests.sh test_dynamodb
          scripts/run-moto-tests.sh test_ssm
          scripts/run-moto-tests.sh test_secretsmanager
          scripts/run-moto-tests.sh test_sns
          scripts/run-moto-tests.sh test_awslambda
          scripts/run-moto-tests.sh test_events
          scripts/run-moto-tests.sh test_kinesis
          scripts/run-moto-tests.sh test_kms
      - name: KMS API and envelope SDK smoke
        run: python3 scripts/smoke-kms.py
      - name: Known-failure audit tooling tests
        run: .venv-moto/bin/python scripts/test-audit-moto-tests.py
      - name: CloudFormation lifecycle and persistence SDK smoke
        run: .venv-moto/bin/python scripts/smoke-cloudformation.py
      - name: Kinesis isolation and persistence SDK smoke
        run: .venv-moto/bin/python scripts/smoke-kinesis.py
      - name: DynamoDB isolation and persistence SDK smoke
        run: .venv-moto/bin/python scripts/smoke-dynamodb.py
      - name: Lambda executor SDK smoke (command, HTTP, S3 to SQS)
        run: .venv-moto/bin/python scripts/smoke-lambda.py

      - name: Lua setup and SQS pipeline SDK smoke (shell, HTTP, restart)
        run: .venv-moto/bin/python scripts/smoke-lua.py

      - name: EventBridge SDK smoke (Lua, S3, Lambda, SQS)
        run: .venv-moto/bin/python scripts/smoke-eventbridge.py

      - name: Unsupported-call discovery SDK smoke
        run: .venv-moto/bin/python scripts/smoke-unsupported.py

      - name: Inspection resource browser and Lua demo fixtures smoke
        run: |
          python scripts/smoke-inspection.py
          python scripts/smoke-demo.py
